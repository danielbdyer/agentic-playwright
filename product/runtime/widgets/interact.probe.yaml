# Fixture specification for the `interact` verb.
# Grammar: docs/v2-readiness.md §4 (first-principles revision,
# Step-6 F3).
#
# interact's four declared error families map to four orthogonal
# SurfaceSpec axes. No hooks; no world-setup vocabulary; each
# fixture declares the actual DOM state as SurfaceSpec fields and
# the classifier responds to the real DOM at rung 3.

verb: interact
schemaVersion: 1

fixtures:
  - name: click-visible-enabled-button
    description: |
      Happy path. Button is visible and enabled; click dispatches
      successfully. Role-based dispatcher resolves affordance.
      Entropy profile perturbs the chrome; the matched verdict is
      invariant.
    input:
      action: click
      target: { role: button, name: "Action" }
    world:
      surfaces:
        - { role: button, name: "Action" }
      entropy:
        seed: interact-click-visible
        wrapperDepth: [1, 2]
        chromeTone: [reef, ember]
        spacingDensity: [tidy, stacked]
        siblingJitter: [0, 1]
        calloutShuffle: { count: 2 }
        badgeSubset: [1, 3]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher

  - name: click-hidden-button-fails-not-visible
    description: |
      Visibility axis → display-none. Playwright's actionability
      check sees no visible element; classifier reads isVisible()
      false and emits not-visible. Entropy-invariant.
    input:
      action: click
      target: { role: button, name: "Action" }
    world:
      surfaces:
        - { role: button, name: "Action", visibility: display-none }
      entropy:
        seed: interact-click-hidden
        wrapperDepth: [2, 3]
        chromeTone: [atlas, slate]
        siblingJitter: [1, 2]
    expected:
      classification: failed
      error-family: not-visible
    exercises:
      - error-family: not-visible

  - name: input-disabled-field-fails-not-enabled
    description: |
      Enabled axis → false. The backing input carries `disabled`;
      classifier reads isEnabled() false and emits not-enabled.
      Entropy-invariant.
    input:
      action: input
      target: { role: textbox, name: "Field" }
      value: "any"
    world:
      surfaces:
        - { role: textbox, name: "Field", enabled: false }
      entropy:
        seed: interact-input-disabled
        wrapperDepth: [1, 2]
        chromeTone: [ember]
        calloutShuffle: { count: 2 }
    expected:
      classification: failed
      error-family: not-enabled
    exercises:
      - error-family: not-enabled

  - name: click-detaches-before-action-fails-timeout
    description: |
      detachAfterMs axis → the substrate schedules element removal
      1ms after mount. Playwright's click actionability check
      retries; the element is gone; TimeoutError fires. Entropy-
      invariant (chrome renders, then the target detaches).
    input:
      action: click
      target: { role: button, name: "Action" }
    world:
      surfaces:
        - { role: button, name: "Action", detachAfterMs: 1 }
      entropy:
        seed: interact-click-detach
        wrapperDepth: [1, 1]
        chromeTone: [reef]
        siblingJitter: [0, 1]
    expected:
      classification: failed
      error-family: timeout
    exercises:
      - error-family: timeout

  - name: fill-non-input-target-fails-assertion
    description: |
      inputBacking axis → div-with-role. The surface has
      role=textbox but is a <div>, not an <input>. Playwright's
      fill() raises "Element is not an <input>"; classifier maps
      the message to assertion-like. Entropy-invariant.
    input:
      action: input
      target: { role: textbox, name: "Field" }
      value: "any"
    world:
      surfaces:
        - { role: textbox, name: "Field", inputBacking: div-with-role }
      entropy:
        seed: interact-fill-non-input
        wrapperDepth: [2, 2]
        chromeTone: [quartz, slate]
        spacingDensity: [compact]
        badgeSubset: [0, 2]
    expected:
      classification: failed
      error-family: assertion-like
    exercises:
      - error-family: assertion-like

  - name: click-target-among-many-same-role
    description: |
      Role-disambiguation probe for interact. The world renders
      five buttons; the target's name picks "Save" specifically.
      Tests that interact's click dispatches to the correctly-
      disambiguated element. Entropy-invariant.
    input:
      action: click
      target: { role: button, name: "Save" }
    world:
      surfaces:
        - { role: button, name: "Cancel" }
        - { role: button, name: "Save" }
        - { role: button, name: "Reset" }
        - { role: button, name: "Help" }
      entropy:
        seed: interact-many-buttons
        wrapperDepth: [1, 2]
        chromeTone: [ember]
        siblingJitter: [0, 1]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - composition: role-disambiguation

  - name: click-submit-inside-login-form
    description: |
      Dispatch click on a Submit button inside a form landmark.
      Uses the login-form preset — the substrate renders a real
      <form onSubmit={...}> containing two required textboxes
      and a Submit button. The probe tests that click traverses
      form-nested focusable elements correctly at rung 3.
    input:
      action: click
      target: { role: button, name: "Submit" }
    world:
      preset: login-form
      entropy:
        seed: interact-submit-login
        wrapperDepth: [1, 2]
        chromeTone: [reef, atlas]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - composition: form-submit
      - preset: login-form

  - name: fill-required-field-in-login-form
    description: |
      Fill a required textbox inside the login-form preset. Tests
      that interact's fill dispatch reaches nested form fields and
      succeeds despite the aria-required attribute.
    input:
      action: input
      target: { role: textbox, name: "Identifier" }
      value: "alice"
    world:
      preset: login-form
      entropy:
        seed: interact-fill-required
        chromeTone: [ember]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - axis: required
      - preset: login-form

  - name: click-save-inside-prefilled-form
    description: |
      Prefilled form: every required field has an initialValue so
      submit reveals the success alert. Click the Save button
      inside the form landmark. The success-alert isn't the
      target — this probe verifies the click dispatches; a
      separate observe probe can see the revealed alert.
    input:
      action: click
      target: { role: button, name: "Save" }
    world:
      preset: prefilled-form
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - composition: form-submit-success
      - preset: prefilled-form

  # ─── Reality-study shapes (docs/v2-substrate-reality-study.md §4) ───
  # Each fixture below poses a DOM shape the first real OutSystems
  # Reactive harvest exhibited and the substrate previously could not.

  - name: fill-placeholder-named-search-by-role
    description: |
      Reality-study F2 (S1): a search input named by `placeholder`
      ALONE — no label, no aria-label. The role query still reaches
      it: accname step 2D takes the placeholder as the accessible
      name (verified empirically 2026-09-16, refuting the study's
      §2 claim that only getByPlaceholder can). The world lives in
      real Reactive chrome (`data-block` nesting, 3–5 deep).
    input:
      action: input
      target: { role: textbox, name: "Search products" }
      value: "headset"
    world:
      surfaces:
        - { role: textbox, naming: none, placeholder: "Search products" }
      entropy:
        seed: interact-placeholder-search
        chromeVocabulary: reactive-block
        wrapperDepth: [3, 5]
        siblingJitter: [0, 2]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - axis: naming-none
      - axis: placeholder

  - name: fill-by-placeholder-locator
    description: |
      Reality-study C1: the `placeholder` locator kind, which the
      product's LocatorStrategyKind declared but nothing exercised.
      Same placeholder-only surface, addressed by getByPlaceholder.
    input:
      action: input
      target: { placeholder: "Search products" }
      value: "headset"
    world:
      surfaces:
        - { role: textbox, naming: none, placeholder: "Search products" }
      entropy:
        seed: interact-placeholder-locator
        chromeVocabulary: reactive-block
        wrapperDepth: [2, 4]
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: placeholder-locator
      - axis: placeholder

  - name: fill-label-for-named-field
    description: |
      Reality-study F2 (S2): a true data-entry form names its inputs
      by a sibling `<label for=id>` (Productform, 6 of 7 inputs).
      The role query resolves the label text as the accessible name.
    input:
      action: input
      target: { role: textbox, name: "Product name" }
      value: "Aurora headset"
    world:
      preset: reactive-entry-form
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - axis: naming-label-for
      - preset: reactive-entry-form

  - name: fill-label-wrap-named-field
    description: |
      Reality-study F2: the wrapping-`<label>` realization (1 of the
      corpus's 435 named elements — rare but real). Textarea backing.
    input:
      action: input
      target: { role: textbox, name: "Description" }
      value: "Over-ear, wireless"
    world:
      preset: reactive-entry-form
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - axis: naming-label-wrap
      - preset: reactive-entry-form

  - name: click-roleless-filter-by-text
    description: |
      Reality-study F3 (S3 / C2) — the highest-leverage gap. The
      target is a `<div style="cursor:pointer">` with NO ARIA role
      and the visible text "Filter"; ~24% of real Reactive controls
      look like this. No role query can reach it; the text locator
      can. Click dispatches; classification is matched.
    input:
      action: click
      target: { text: "Filter" }
    world:
      preset: reactive-record-list
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: text-locator
      - axis: roleless-clickable
      - preset: reactive-record-list

  - name: click-roleless-hidden-fails-not-visible
    description: |
      Roleless clickable rendered display:none. The DOM handle sees
      it; isVisible() is false; not-visible. The visibility axis is
      orthogonal to rolelessness.
    input:
      action: click
      target: { text: "Back to Overview" }
    world:
      surfaces:
        - { role: generic, name: "Back to Overview", clickable: true, visibility: display-none }
      entropy:
        seed: interact-roleless-hidden
        chromeVocabulary: reactive-block
        wrapperDepth: [1, 3]
    expected:
      classification: failed
      error-family: not-visible
    exercises:
      - error-family: not-visible
      - axis: roleless-clickable

  - name: fill-roleless-target-fails-assertion
    description: |
      Filling a roleless <div> — the same "Element is not an <input>"
      assertion div-with-role raises. Pins that a text-located
      surface still goes through fill's actionability contract.
    input:
      action: input
      target: { text: "Filter" }
      value: "any"
    world:
      surfaces:
        - { role: generic, name: "Filter", clickable: true }
      entropy:
        seed: interact-roleless-fill
    expected:
      classification: failed
      error-family: assertion-like
    exercises:
      - error-family: assertion-like
      - axis: roleless-clickable

  - name: click-nav-link-in-reactive-chrome
    description: |
      Reality-study F4/F5: a content-named link inside the
      `navigation` landmark, wrapped 3–5 levels deep in `data-block`
      / `data-container` chrome with structural ids. The click must
      be invariant under the real wrapper vocabulary, not just the
      historical fuzz-shell one.
    input:
      action: click
      target: { role: link, name: "Requests" }
    world:
      preset: reactive-record-list
    expected:
      classification: matched
      error-family: null
    exercises:
      - rung: role-dispatcher
      - axis: chrome-vocabulary-reactive-block
      - preset: reactive-record-list
